<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box-parent {
        width: 100vw;
        background-color: red;
        height: 60vh;
        display: flex;
        flex-direction: row-reverse;
      }

      .box-item:nth-child(1) {
        background-color: rgb(76, 215, 33);
        height: 20%;
      }

      .box-item {
        background-color: aqua;
        height: 80%;
        width: 50%;
      }

      .file-upload {
        background-color: rgb(25, 68, 187);
        height: 5rem;
        display: block;
        margin-top: 5rem;
        width: fit-content;
        height: fit-content;
        color: white;
        padding: 1rem;
      }

      #myFile {
        display: none;
      }
    </style>
    <script>
      const array = [1, 2, 3];
      console.log(array);

      function test() {
        array.forEach((item) => console.log(item));
      }

      test();
    </script>
  </head>
  <body>
    <div class="box-parent">
      <div class="box-item"></div>
      <div class="box-item"></div>
    </div>
    <label for="myFile" class="file-upload">Send File</label>
    <input type="file" id="myFile" />
    <div id="test">hallo</div>
  </body>
</html>
